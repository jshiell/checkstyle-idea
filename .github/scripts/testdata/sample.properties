# Sample properties fixture mirroring checkstyle-idea.properties structure for tests.
# Exercises: line continuations, irregular comma spacing, a trailing comma, a
# bundledVersions value that differs from the supported list (to catch a parser
# that reads the wrong property), and a map key whose version exceeds the
# supported max (to catch a parser that reads the map raw or misses it as a
# "handled" version).

checkstyle.versions.supported = \
    10.0, 10.1,10.2, 10.3.4, \
    11.0.1, 11.2.0,

baseVersion = 10.0

bundledVersions = 99.9.9

checkstyle.versions.map = \
    8.0 -> 10.0,8.1 -> 10.0, \
    20.0.0 -> 11.2.0
